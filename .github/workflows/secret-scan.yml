name: Secret Scan

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    # On push events, only run for the repository's default branch.
    # Pull request events always run.
    if: github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch
    container:
      image: ghcr.io/gitleaks/gitleaks:v8.21.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: gitleaks detect --source . --redact --verbose --exit-code 1
